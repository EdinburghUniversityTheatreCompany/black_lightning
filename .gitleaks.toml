# dev-env standard (dev-hooks:dev-env-setup): gitleaks allowlist.
#
# `gitleaks dir` has no respect-gitignore flag and scans gitignored files too, so without this a
# local `.env`, `log/`, `tmp/` or `config/credentials/*.key` turns `hk run check` red on every commit.
#
# gitleaks loads `.gitleaks.toml` from the scan root, so the hk builtin and CI's `gitleaks git` job
# need no `--config`. `useDefault = true` keeps the full default ruleset; the allowlist is
# path-scoped to gitignored runtime/secret locations, so app/config source is still scanned. A secret
# force-added into one of these paths would evade the scan: move it into the encrypted production
# credentials instead.
[extend]
useDefault = true

[allowlist]
description = "gitignored local artifacts + local-only secret files (never committed)"
paths = [
  '''^\.env''',                        # dotenv — gitignored
  '''^log/''', '''^tmp/''',            # Rails runtime artifacts
  '''^\.venv/''',                      # Python (shell/py stacks)
  '''^node_modules/''', '''^vendor/''', '''^\.pnpm-store/''',
  '''^config/credentials/.*\.key$''',  # Rails master keys (the *.yml.enc blobs stay scanned)
  '''^config/secrets\.yml$''',         # gitignored local Rails secrets (legacy secrets.yml — never committed)
  '''^\.worktrees/''',                 # git worktrees (full repo copies incl. local secrets)
  '''^\.claude/worktrees/''',          # native-tool git worktrees (same)
]
