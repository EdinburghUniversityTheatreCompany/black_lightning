[settings]
# mise.lock records resolved versions and checksums, so installs are reproducible.
# Upgrade with `mise upgrade`, then commit the changed mise.lock.
lockfile = true
# `mise upgrade` skips versions published in the last 4 days, the same cooldown as the Bundler
# and npm dependencies. `mise install` still reproduces mise.lock.
minimum_release_age = "4d"

[tools.ruby]
version = "4.0.2"
# A precompiled portable Ruby from jdx/ruby instead of a ruby-build source compile: glibc 2.17
# floor and its own OpenSSL, libyaml and libffi, so it needs no build toolchain.
# Set explicitly so a contributor's global mise `compile` default can't flip mise.lock.
compile = false

[tools.node]
version = "24.13.0"
# Corepack provides the pnpm pinned in package.json's `packageManager`, keeping host, dev
# container and CI in step without making pnpm a mise tool.
postinstall = "corepack enable"

[tools]
# jscpd is not a mise tool: it ships as npm optional platform packages that npx resolves and the
# mise npm backend does not. `herb lint` delegates to npx @herb-tools/linter; the other linters
# are Gemfile gems.
# pnpm is not a mise tool either: corepack (the postinstall hook in [tools.node]) provides the
# version in package.json's `packageManager`, which pnpm/action-setup also reads in CI.

[hooks]
postinstall = [
    { task = "setup" },
]

[env]
# dev-env standard version this repo targets (dev-hooks:dev-env-setup). Do not
# hand-edit — bump it by running the skill's upgrade path.
DEV_ENV_VERSION = "23"
_.path = ["bin"]

# Install dev dependencies
[tasks.install]
depends = ["install:gems", "install:node-modules"]

[tasks]
"install:gems" = "bundle install"
"install:node-modules" = "pnpm install"
"serve:assets" = "vite dev"

# Ensure stubs are valid
[tasks.setup]
depends = ["setup:scripts", "setup:version-files"]

[tasks."setup:version-files"]
run = [
    "mise tool ruby --requested | tr -d '\n' > .ruby-version",
    "mise tool node --requested | tr -d '\n' > .node-version",
]

[tasks."setup:scripts"]
run = "chmod +x ./bin/*"
run_windows = ""

[tasks.serve]
depends = ["serve:assets", "serve:app"]

[tasks."serve:app"]
run = "rails server -b $BINDING"

[tasks."serve:app".env]
PORT = { default = "3000" }
BINDING = { default = "0.0.0.0" }
RUBY_DEBUG_OPEN = "true"
