# Per-worktree isolation (read by the dev-hooks:worktree-setup skill's isolate-worktree.sh).
# Committed on purpose: ports and database-name suffixes are not secrets, and every worktree
# has to agree on how they are derived.
#
# Without this file every worktree shared one dev server port, one dev database and one test
# database, so two `bin/dev`s fought over :3000 and parallel `bin/rails test` runs truncated
# each other's fixtures. The main checkout keeps the plain names (offset 0, empty suffix);
# each worktree gets its own offset and suffix.

WT_BASE_PORT=3000                    # PORT = 3000 + offset (Puma, via Procfile.dev's $BINDING/$PORT)
# vite-ruby's dev server. Based at 3100, NOT at config/vite.json's 3036: VITE_RUBY_PORT
# overrides the port in every environment, so a base of 3036 would give the first worktree
# 3037 — which is the port vite.json gives the TEST environment in the main checkout.
WT_EXTRA_PORTS="VITE_RUBY_PORT=3100"
WT_DB_SUFFIX_VAR=WORKTREE_DB_SUFFIX  # appended to the dev + test database names in config/database.yml

# Run after isolation, from the worktree, so these see its own PORT/WORKTREE_DB_SUFFIX.
# Isolation allocates the names; nothing exists behind them until this runs, and an
# unseeded worktree fails like a broken branch (unprepared test DB -> InnoDB deadlocks in
# unrelated tests; no public/vite-test -> every JS-dependent system test at once).
WT_POST_SETUP="bin/rails db:prepare && bin/rails db:test:prepare && RAILS_ENV=test bin/vite build"
