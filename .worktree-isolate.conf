# Per-worktree isolation (read by the dev-hooks:worktree-setup skill's isolate-worktree.sh).
# Committed on purpose: ports and database-name suffixes are not secrets, and every worktree
# has to agree on how they are derived.
#
# Without this file every worktree shared one dev server port, one dev database and one test
# database, so two `bin/dev`s fought over :3000 and parallel `bin/rails test` runs truncated
# each other's fixtures. The main checkout keeps the plain names (offset 0, empty suffix);
# each worktree gets its own offset and suffix.
#
# After provisioning a worktree, create its databases once:
#   bin/rails db:prepare && bin/rails db:test:prepare

WT_BASE_PORT=3000                    # PORT = 3000 + offset (Puma, via Procfile.dev's $BINDING/$PORT)
WT_EXTRA_PORTS="VITE_RUBY_PORT=3036" # vite-ruby's dev server; config/vite.json's default is 3036
WT_DB_SUFFIX_VAR=WORKTREE_DB_SUFFIX  # appended to the dev + test database names in config/database.yml
