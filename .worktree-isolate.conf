# Per-worktree isolation (read by the dev-hooks:worktree-setup skill's isolate-worktree.sh).
# Committed on purpose: ports and database suffixes are not secrets, and every worktree must
# derive them the same way. The main checkout keeps the plain names (offset 0, empty suffix);
# each worktree gets its own offset and suffix, so dev servers don't fight over :3000 and
# parallel `bin/rails test` runs don't truncate each other's fixtures.

WT_BASE_PORT=3000                    # PORT = 3000 + offset (Puma, via the serve:app mise task's $BINDING/$PORT)
# vite-ruby's dev server. Based at 3100, not config/vite.json's 3036: VITE_RUBY_PORT overrides
# the port in every environment, so 3036 would give the first worktree 3037, the TEST port
# in the main checkout.
WT_EXTRA_PORTS="VITE_RUBY_PORT=3100"
WT_DB_SUFFIX_VAR=WORKTREE_DB_SUFFIX  # appended to the dev + test database names in config/database.yml

# Run after isolation, from the worktree, so these see its own PORT/WORKTREE_DB_SUFFIX. An
# unseeded worktree fails like a broken branch: an unprepared test DB deadlocks InnoDB in
# unrelated tests, and no public/vite-test fails every JS-dependent system test.
WT_POST_SETUP="bin/rails db:prepare && bin/rails db:test:prepare && RAILS_ENV=test bin/vite build"
