daily_maintenance:
  class: DailyMaintenanceJob
  queue: default
  schedule: at 2:03am every day

refresh_fuzzy_duplicates:
  class: RefreshFuzzyBothDuplicatesJob
  queue: default
  schedule: at 4:06am every day

opportunity_digest:
  class: OpportunityDigestJob
  queue: default
  schedule: at 9:09am every day

reimbursements_credentials_check:
  class: Reimbursements::CredentialsCheckJob
  queue: default
  schedule: at 8:08am every day

# Clears the bank details of payees who have not claimed in six months. No-ops when none are due.
reimbursements_bank_details_retention:
  class: Reimbursements::BankDetailsRetentionJob
  queue: default
  schedule: at 3:02am every day

reimbursements_mailbox_poll:
  class: Reimbursements::MailboxPollJob
  queue: default
  schedule: every 5 minutes

# The job skips cost centres whose run-days exclude today and de-dupes via CostCentre#nightly_due?.
reimbursements_nightly_batch:
  class: Reimbursements::NightlyBatchJob
  queue: default
  schedule: at 9:11pm every day

# The crypt climate monitor's outdoor comparison line. Hourly, matching Open-Meteo's resolution;
# each run re-fetches a rolling multi-day window and upserts it, so an outage backfills itself.
# Indoor readings arrive by CSV import, not by polling.
climate_outdoor_poll:
  class: Climate::OutdoorPollJob
  queue: default
  schedule: every hour

# Ingests Govee CSV exports emailed to the climate mailbox. Quiet when none is configured.
climate_mailbox_poll:
  class: Climate::MailboxPollJob
  queue: default
  schedule: every 15 minutes

# Brings every pretix membership in line with the website's member roles. This is what keeps the
# sync correct: role-removal paths (Role#archive's users.clear, user destruction) fire no
# association callbacks and can only be caught here. A settled shop writes nothing; a pass is
# ~660 paced API reads, about three and a half minutes.
pretix_reconcile_memberships:
  class: Pretix::ReconcileMembershipsJob
  queue: default
  schedule: at 3:17am every day

# Keeps every event with performance sync ticked in step with its pretix series. Every 15 minutes
# because sold-out state moves even though dates barely do, and one job covering both is one path.
#
# Offset off the quarter-hour: reimbursements_mailbox_poll owns every minute divisible by five, and
# climate_mailbox_poll sits on :00/:15/:30/:45 (recurring_schedule_test).
pretix_sync_performances:
  class: Pretix::SyncPerformancesJob
  queue: default
  schedule: 7,22,37,52 * * * *
