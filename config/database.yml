# database configured to use mysql
# Make sure you set up a different test database and development database.

default: &default
  adapter: mysql2
  encoding: utf8mb4
  # Without this, a freshly created database (a new worktree, a rebuilt CI
  # runner) takes the MySQL server's own default collation instead — on this
  # server that's utf8mb4_0900_ai_ci, not the utf8mb4_unicode_ci every table
  # in db/schema.rb carries. That's not cosmetic: a column-to-column
  # comparison across the two collations raises "Illegal mix of collations"
  # (found via reimbursements_nominal_codes, freshly migrated here while
  # reimbursements_budgets.nominal_code stayed on the historical collation).
  collation: utf8mb4_unicode_ci
  # For details on connection pooling, see Rails configuration guide
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: "<%= ENV.fetch('DB_USERNAME') { Rails.application.credentials.dig(:database, :username) } %>"
  password: "<%= ENV.fetch('DB_PASSWORD') { Rails.application.credentials.dig(:database, :password) } %>"
  host: "<%= ENV.fetch('DB_HOST') { '127.0.0.1' } %>"
  port: 3306

# WORKTREE_DB_SUFFIX (see .worktree-isolate.conf) gives a git worktree its own dev stack, so
# two `bin/dev`s don't share one development database. Empty by default -> the plain names,
# which is what the main checkout uses. A worktree creates its own with `bin/rails db:prepare`.
development:
  primary:
    <<: *default
    database: bedlam_blacklightning_development<%= ENV.fetch("WORKTREE_DB_SUFFIX", "") %>

  queue:
    <<: *default
    database: bedlam_blacklightning_development<%= ENV.fetch("WORKTREE_DB_SUFFIX", "") %>_queue
    migrations_paths: db/queue_migrate

  cache:
    <<: *default
    database: bedlam_blacklightning_development<%= ENV.fetch("WORKTREE_DB_SUFFIX", "") %>_cache
    migrations_paths: db/cache_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
#
# WORKTREE_DB_SUFFIX lets parallel git worktrees each run tests against their own
# database (e.g. "_phaseb"), so concurrent `bin/rails test` runs don't truncate
# each other's fixtures. Empty by default -> the normal shared test DB.
test:
  <<: *default
  database: bedlam_blacklightning_test<%= ENV.fetch("WORKTREE_DB_SUFFIX", "") %>

production:
  primary: &primary_production
    adapter: mysql2
    encoding: utf8mb4
    collation: utf8mb4_unicode_ci
    reconnect: false
    database: bedlam_blacklightning_production
    pool: 5
    username: "<%= ENV['DATABASE_USERNAME'] %>"
    password: "<%= ENV['MYSQL_ROOT_PASSWORD'] %>"
    host: "<%= ENV['DATABASE_HOST'] %>"
  queue:
    <<: *primary_production
    database: bedlam_blacklightning_production_queue
    migrations_paths: db/queue_migrate

  cache:
    <<: *primary_production
    database: bedlam_blacklightning_production_cache
    migrations_paths: db/cache_migrate
    # The Solid Cache pool only needs one connection per request/job thread
    # (RAILS_MAX_THREADS, default 3), not the primary's 5 — each idle mysql2
    # connection holds a buffer. Overridable via CACHE_DB_POOL if cache traffic
    # ever needs more headroom.
    pool: <%= ENV.fetch("CACHE_DB_POOL", ENV.fetch("RAILS_MAX_THREADS", 3)) %>
