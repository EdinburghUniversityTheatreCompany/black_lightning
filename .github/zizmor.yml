# .github/zizmor.yml (dev-env standard v31). zizmor's dependabot-cooldown audit fails any
# Dependabot cooldown under 7 days; the standard's is 3, so lower its minimum to match.
# Copy beside .github/dependabot.yml whenever that file sets `default-days: 3`.
rules:
  dependabot-cooldown:
    config:
      days: 3
