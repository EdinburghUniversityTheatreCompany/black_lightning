# Skip releases younger than 4 days (in minutes), the same cooldown as the Gemfile's
# `cooldown: 4` and mise's minimum_release_age. Set here so it holds for every checkout, not only
# where a global pnpm config sets it.
minimumReleaseAge: 5760

allowBuilds:
  "@parcel/watcher": true

overrides:
  # @tailwindcss/typography 0.5.20 pins postcss-selector-parser 6.0.10, which has
  # advisories fixed only from 6.1.5, so Dependabot cannot update it. Drop this once
  # a typography release depends on a fixed version.
  "@tailwindcss/typography>postcss-selector-parser": "^6.1.5"
