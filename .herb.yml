# Herb config (dev-env standard, dev-hooks:dev-env-setup). Generated by `herb lint --init`; the
# recommended ruleset is on by default, so `rules:` lists only opt-outs. Regenerate the version
# line with `herb lint --upgrade` after bumping the herb gem.
# Configuration: https://herb-tools.dev/configuration

version: 0.10.1

# # Framework / template engine (defaults: ruby / erubi)
# framework: ruby
# template_engine: erubi

linter:
  enabled: true

  # # Exit with error code when diagnostics of this severity or higher are present.
  # # Valid: error (default) | warning | info | hint
  # failLevel: error

  # The HTML-email header/footer are intentional fragments (_header opens the table/div/body
  # structure, _footer closes it), so herb's per-file parser reports unmatched tags in both.
  # Restructuring the hand-tuned MSO-conditional markup into one layout risks rendering for no gain.
  exclude:
    # Plain text, not HTML: the & in the Ransack Disallow rules is literal.
    - "app/views/robots/show.text.erb"
    - 'app/views/shared/mail/_header.html.erb'
    - 'app/views/shared/mail/_footer.html.erb'

  rules:
    # 38 partials read @ivars set by their parent view. Converting them to explicit locals is a
    # large refactor with regression risk and little correctness benefit.
    erb-no-instance-variables-in-partials:
      enabled: false
    # View-data structures are built in `<% %>` (`fields = { ... link_to ... }`, `quick_actions <<
    # link_to(...)`) and rendered later by the shared show/index framework. Every flag was an
    # assignment, not swallowed output, and `<%=` would emit the assignment's value.
    actionview-no-silent-helper:
      enabled: false

# Lets the Herb language server format ERB on save. CI does not format; `lint-on-edit` applies
# `herb lint --fix` on write.
formatter:
  enabled: true
  indentWidth: 2
  maxLineLength: 120   # Rails-friendly
