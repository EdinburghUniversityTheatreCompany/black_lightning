# database configured to use mysql
# Make sure you set up a different test database and development database.

default: &default
  adapter: mysql2
  encoding: utf8mb4
  # Without this a new database (worktree, CI runner) takes the server's default collation
  # (utf8mb4_0900_ai_ci here), not the utf8mb4_unicode_ci every table in db/schema.rb carries, and
  # comparing columns across the two raises "Illegal mix of collations".
  collation: utf8mb4_unicode_ci
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: "<%= ENV.fetch('DB_USERNAME') { Rails.application.credentials.dig(:database, :username) } %>"
  password: "<%= ENV.fetch('DB_PASSWORD') { Rails.application.credentials.dig(:database, :password) } %>"
  host: "<%= ENV.fetch('DB_HOST') { '127.0.0.1' } %>"
  port: 3306

# WORKTREE_DB_SUFFIX (.worktree-isolate.conf) gives a worktree its own development databases.
# Empty means the plain names the main checkout uses; a worktree creates its own with
# `bin/rails db:prepare`.
development:
  primary:
    <<: *default
    database: bedlam_blacklightning_development<%= ENV.fetch("WORKTREE_DB_SUFFIX", "") %>

  queue:
    <<: *default
    database: bedlam_blacklightning_development<%= ENV.fetch("WORKTREE_DB_SUFFIX", "") %>_queue
    migrations_paths: db/queue_migrate

  cache:
    <<: *default
    database: bedlam_blacklightning_development<%= ENV.fetch("WORKTREE_DB_SUFFIX", "") %>_cache
    migrations_paths: db/cache_migrate

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
#
# WORKTREE_DB_SUFFIX lets parallel worktrees test against their own database (e.g. "_phaseb"), so
# concurrent `bin/rails test` runs don't truncate each other's fixtures. Empty means the shared DB.
test:
  <<: *default
  database: bedlam_blacklightning_test<%= ENV.fetch("WORKTREE_DB_SUFFIX", "") %>

production:
  primary: &primary_production
    adapter: mysql2
    encoding: utf8mb4
    collation: utf8mb4_unicode_ci
    reconnect: false
    database: bedlam_blacklightning_production
    pool: 5
    username: "<%= ENV['DATABASE_USERNAME'] %>"
    password: "<%= ENV['MYSQL_ROOT_PASSWORD'] %>"
    host: "<%= ENV['DATABASE_HOST'] %>"
  queue:
    <<: *primary_production
    database: bedlam_blacklightning_production_queue
    migrations_paths: db/queue_migrate

  cache:
    <<: *primary_production
    database: bedlam_blacklightning_production_cache
    migrations_paths: db/cache_migrate
    # One connection per request/job thread (RAILS_MAX_THREADS, default 3), not the primary's 5:
    # each idle mysql2 connection holds a buffer. CACHE_DB_POOL overrides.
    pool: <%= ENV.fetch("CACHE_DB_POOL", ENV.fetch("RAILS_MAX_THREADS", 3)) %>
