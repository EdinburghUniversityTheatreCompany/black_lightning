name: CI

on:
  pull_request:
  push:
    branches: [ main ]

permissions: {}

env:
  MISE_ENV: "development"
  MISE_NO_HOOKS: 1

jobs:
  scan_ruby:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for vulnerable gem versions
        run: bundle exec bundler-audit --update

  lint_ruby:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint Ruby code for consistent style
        run: bin/rubocop -f github

      # herb-analyze is advisory only because the two HTML-email fragment partials
      # (shared/mail/_header|_footer) can't be parsed standalone; herb-lint gates the rest.
      - name: Analyze ERB templates for parse errors (herb, advisory — email fragments only)
        run: bundle exec herb analyze app/ || true

      - name: Lint ERB templates (herb)
        # Pinned to the version hk.pkl runs; bump both together. `bundle exec herb lint` runs an
        # unpinned npx, so a new release can fail a commit that touched no ERB.
        run: npx --yes @herb-tools/linter@0.10.4 app/ --github

      - name: Executable bits on shipped scripts
        # A tracked shebang file must be mode 100755 in the index: with core.fileMode=false a local
        # chmod never reaches git, and a 100644 script dies with exit 126 on every fresh clone.
        run: |
          bad=$(git ls-files -s | awk -F'\t' '$1 ~ /^100644/ { if ((getline line < $2) > 0 && line ~ /^#!/) print $2; close($2) }')
          if [ -n "$bad" ]; then
            echo "Shebang scripts missing the executable bit in the git index. Fix: git update-index --chmod=+x <file>"
            echo "$bad"
            exit 1
          fi

  lint_js:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # No version: pnpm/action-setup reads package.json's `packageManager`, as corepack does.

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint JavaScript code for consistent style
        run: pnpm lint

  # Versions are pinned in several files (mise/config.toml, the .<lang>-version files, Dockerfile
  # ARGs, deploy.yml and devcontainer `image:` tags) and nothing else makes them agree; that let
  # the prod image ship Node 22 while everything else ran 24. Reads files only, so needs no toolchain.
  versions:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain and service versions agree across files
        run: bash scripts/check_version_sync.sh

      - name: Prod Dockerfile still derives the Node major from .node-version
        # The Dockerfile derives the Node major at build time, so the version gate has no static
        # pin to compare. Keep it that way.
        run: |
          fail=0
          grep -qF 'setup_$(cut -d. -f1 < .node-version)' Dockerfile || { echo "::error::prod Dockerfile must derive the Node major from .node-version, not hardcode it"; fail=1; }
          ! grep -q '^ARG NODE_VERSION=' Dockerfile || { echo "::error::remove hardcoded ARG NODE_VERSION from Dockerfile; derive it from .node-version"; fail=1; }
          exit $fail

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    services:
      mysql:
        image: mysql:8.4@sha256:c36050afdca850f23cef85703f84c7531a5ae155a11b5ee1c60acb09937c4084
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
        ports:
          - 3306:3306
        # 30s of patience at a finer interval: Docker waits a full interval before the first probe.
        options: --health-cmd="mysqladmin ping" --health-interval=3s
          --health-timeout=5s --health-retries=10

    steps:
      # Keep in step with the production Dockerfile and .devcontainer/Dockerfile.dev. Name
      # libheif-plugin-libde265: Ubuntu's libvips pulls in libheif but no codec plugin, so HEIC
      # receipts fail to decode ("Unsupported codec") on CI only. Chrome, ChromeDriver, git and
      # pkg-config are preinstalled on the runner.
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y
          build-essential libvips-dev poppler-utils libheif-plugin-libde265

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # No version: pnpm/action-setup reads package.json's `packageManager`, as corepack does.

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build JavaScript assets
        run: bin/vite build --mode=test
        env:
          RAILS_ENV: test

      - name: Run tests
        env:
          RAILS_ENV: test
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: bin/rails db:test:prepare test test:system

      - name: Model/DB consistency (database_consistency, advisory)
        # ADVISORY (|| true): ~330 schema findings (NOT NULL, length, unique-index, FK) that need
        # data-aware migrations on the legacy DB; drop `|| true` to gate (plans/off-topic-improvements.md).
        env:
          RAILS_ENV: test
          DB_USERNAME: root
          DB_PASSWORD: ""
        run: bundle exec database_consistency || true

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  # The MIT gitleaks CLI via mise (pinned in mise/mise.development.lock), not gitleaks-action,
  # which needs a paid GITLEAKS_LICENSE on org-owned repos. It is what the hk pre-commit hook runs.
  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # gitleaks git scans the full commit history

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "gitleaks"

      - name: Scan git history for secrets
        run: mise exec -- gitleaks git --redact --no-banner .

  # actionlint (correctness) + zizmor (security: credential persistence, template injection, token
  # scope), both pinned in mise/mise.development.lock.
  actions-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install_args: "actionlint"

      - name: Lint workflows (actionlint)
        # -shellcheck= is deliberate: run: blocks word-split on purpose, and real *.sh files are
        # covered elsewhere.
        run: actionlint -shellcheck=

      - name: Scan workflows with zizmor
        run: zizmor --no-progress .github/workflows/

  # Noisier audits: debride, flay, fasterer, jscpd, large files.
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Dead code (debride)
        # bundler-cache installs gems into vendor/bundle inside the repo; exclude it or debride
        # scans every gem as dead code.
        run: bundle exec debride --exclude vendor,node_modules,tmp,log .

      - name: Duplication (flay — Ruby structural, advisory)
        run: bundle exec flay . || true # flay exits 0 anyway; surfaces structural clones

      - name: Performance anti-patterns (fasterer — advisory)
        run: bundle exec fasterer || true

      - name: Duplication (jscpd — polyglot gate)
        # Shared with the hk gate via scripts/run-jscpd.sh (latest on a 4-day cooldown, floored at
        # v5); --require makes an unrunnable jscpd fail the job.
        run: bash scripts/run-jscpd.sh --require ruby,erb,javascript,typescript,css,scss,sass,vue

      - name: Large files
        run: |
          limit=512000
          large=$(git ls-files | while read -r f; do
            s=$(stat -c%s "$f" 2>/dev/null || echo 0)
            if [ "$s" -gt "$limit" ]; then echo "$f ($s bytes)"; fi
          done)
          if [ -n "$large" ]; then echo "Files exceed ${limit} bytes:"; echo "$large"; exit 1; fi
