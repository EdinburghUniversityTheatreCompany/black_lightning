daily_maintenance:
  class: DailyMaintenanceJob
  queue: default
  schedule: at 2am every day

refresh_cloudflare_ips:
  class: RefreshCloudflareIpsJob
  queue: default
  schedule: every 12 hours

refresh_fuzzy_duplicates:
  class: RefreshFuzzyBothDuplicatesJob
  queue: default
  schedule: at 4am every day

opportunity_digest:
  class: OpportunityDigestJob
  queue: default
  schedule: at 9am every day

reimbursements_credentials_check:
  class: Reimbursements::CredentialsCheckJob
  queue: default
  schedule: at 8am every day

# Nudges budget owners about pending claims awaiting their sign-off (the
# owner-endorsement gate). Sent via the website mailer; the job no-ops when
# nothing awaits, so a daily trigger is safe.
reimbursements_owner_endorsement_digest:
  class: Reimbursements::OwnerEndorsementDigestJob
  queue: default
  schedule: at 7am every day

# Storage limitation: clears the bank details of payees who have not claimed in
# six months. No-ops on nights with nothing to clear, so a daily trigger is safe.
reimbursements_bank_details_retention:
  class: Reimbursements::BankDetailsRetentionJob
  queue: default
  schedule: at 3am every day

reimbursements_mailbox_poll:
  class: Reimbursements::MailboxPollJob
  queue: default
  schedule: every 5 minutes

# Fires nightly; the job itself skips cost centres whose run-days don't include
# today and de-dupes via CostCentre#nightly_due?, so a daily trigger is safe.
reimbursements_nightly_batch:
  class: Reimbursements::NightlyBatchJob
  queue: default
  schedule: at 9pm every day


# The crypt climate monitor's outdoor comparison line. Hourly, matching
# Open-Meteo's resolution; each run re-fetches a rolling multi-day window and
# upserts it, so an outage backfills itself. Indoor readings arrive by CSV
# import, not by polling.
#
# An interval schedule is zone-agnostic — the config.time_zone ("Edinburgh")
# resolution noted in CLAUDE.md would only bite on a clock-time climate job.
climate_outdoor_poll:
  class: Climate::OutdoorPollJob
  queue: default
  schedule: every hour

# Ingests Govee CSV exports emailed to the shared climate mailbox. No-ops when
# no mailbox is configured, so an environment without one is simply quiet.
climate_mailbox_poll:
  class: Climate::MailboxPollJob
  queue: default
  schedule: every 15 minutes

# Brings every pretix membership back in line with the website's member roles.
# This is what makes the sync correct — several role-removal paths (Role#archive's
# users.clear, user destruction) fire no callbacks and can only be caught here.
# Runs after the other nightly jobs; a settled shop writes nothing.
pretix_reconcile_memberships:
  class: Pretix::ReconcileMembershipsJob
  queue: default
  schedule: at 3am every day
