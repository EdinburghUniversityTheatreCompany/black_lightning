services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile.dev
    volumes:
      - ..:/workspaces/BlackLightning:cached
      - bundle-cache:/bundle
      # Persist the mise toolchain across rebuilds so mise install does not re-download it.
      # Path matches MISE_DATA_DIR.
      - mise-data:/home/vscode/.local/share/mise
    command: sleep infinity
    environment:
      BUNDLE_PATH: /bundle/vendor
      DB_HOST: mysql
      DB_USERNAME: root
      DB_PASSWORD: password
    depends_on:
      - mysql
    ports:
      # Tracks $PORT (worktree-setup's isolate writes it to .devcontainer/.env) so parallel
      # per-worktree devcontainers don't clash on one host port. Falls back to 3000.
      - "${PORT:-3000}:${PORT:-3000}"

  mysql:
    # Pinned, not `mysql:8`: a floating major drifted from 8.0 to 8.4 and left dev on a different
    # server than production. CI's `versions` job checks it matches ci.yml and config/deploy.yml.
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql-data:/var/lib/mysql
    # No host port: the app reaches MySQL over the compose network, and publishing one would clash
    # between parallel worktree devcontainers. For a host-side GUI: `docker compose port mysql 3306`.

volumes:
  mysql-data:
  bundle-cache:
  mise-data:
