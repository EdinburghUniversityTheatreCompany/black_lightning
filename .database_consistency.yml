# database_consistency configuration.
# A top-level model name disables it; `DatabaseConsistencyCheckers: <Name>: enabled: false` disables
# a checker globally; Model -> column -> Checker scopes a single finding.

# Rails false positives (ActionText / ActiveStorage internal tables), from the gem's rails_defaults.
ActionText::RichText:
  enabled: false
ActiveStorage::Attachment:
  enabled: false
ActiveStorage::Blob:
  enabled: false
ActiveStorage::VariantRecord:
  enabled: false

DatabaseConsistencyCheckers:
  # Legacy integer primary keys, and the integer FKs pointing at them, are intentional (CLAUDE.md,
  # Database & Migrations). Converting means rewriting every PK and FK in the legacy schema.
  PrimaryKeyTypeChecker:
    enabled: false
  ForeignKeyTypeChecker:
    enabled: false
  # The other schema checkers (NOT NULL, FK, unique index, three-state boolean, indexes) stay on but
  # report findings that need data-aware backfill migrations on the legacy production database;
  # strong_migrations blocks those as unsafe. See plans/off-topic-improvements.md. The check stays
  # advisory (|| true) in hk.pkl and ci.yml until then.
